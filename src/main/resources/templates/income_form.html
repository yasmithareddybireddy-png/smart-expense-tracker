<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Income</title></head>
<body>
<h2 th:text="${income.id}==null ? 'Add Income' : 'Edit Income'"></h2>
<form th:action="@{/incomes/save}" method="post" th:object="${income}">
  <input type="hidden" th:field="*{id}"/>
  <label>Date: <input type="date" th:field="*{date}"/></label><br/>
  <label>Source: <input type="text" th:field="*{source}"/></label><br/>
  <label>Amount: <input type="number" step="0.01" th:field="*{amount}"/></label><br/>
  <button type="submit">Save</button>
</form>
<p><a th:href="@{/incomes}">Back</a></p>
</body>
</html>
