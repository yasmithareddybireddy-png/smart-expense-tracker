<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Monthly Budget</title></head>
<body>
<h2>Monthly Budget</h2>
<p><a th:href="@{/}">Dashboard</a></p>
<form th:action="@{/budgets/save}" method="post" th:object="${budget}">
  <label>Year: <input type="number" th:field="*{year}" /></label><br/>
  <label>Month: <input type="number" th:field="*{month}" min="1" max="12"/></label><br/>
  <label>Amount: <input type="number" step="0.01" th:field="*{amount}"/></label><br/>
  <label>Alert Percent: <input type="number" th:field="*{alertPercent}" min="0" max="100"/></label><br/>
  <button type="submit">Save Budget</button>
</form>

<p>Spent this month: <span th:text="${spent}">0.00</span></p>
<div th:if="${budget.amount != null and budget.amount.doubleValue() > 0}">
  <p>Budget: <span th:text="${budget.amount}"></span></p>
  <div th:if="${(spent != null) and (spent.doubleValue() / budget.amount.doubleValue() * 100) >= budget.alertPercent}">
    <strong style="color:red">Budget alert: you have reached the alert threshold.</strong>
  </div>
</div>
</body>
</html>
