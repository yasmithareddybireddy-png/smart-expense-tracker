<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Incomes</title></head>
<body>
<h2>Incomes</h2>
<p><a th:href="@{/}">Dashboard</a> | <a th:href="@{/incomes/add}">Add Income</a></p>
<table border="1">
  <tr><th>Date</th><th>Source</th><th>Amount</th><th>Actions</th></tr>
  <tr th:each="i : ${incomes}">
    <td th:text="${i.date}"></td>
    <td th:text="${i.source}"></td>
    <td th:text="${i.amount}"></td>
    <td>
      <a th:href="@{|/incomes/edit/${i.id}|}">Edit</a> |
      <a th:href="@{|/incomes/delete/${i.id}|}" onclick="return confirm('Delete?')">Delete</a>
    </td>
  </tr>
</table>
</body>
</html>
