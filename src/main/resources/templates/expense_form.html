<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Expense</title></head>
<body>
<h2 th:text="${expense.id}==null ? 'Add Expense' : 'Edit Expense'"></h2>
<form th:action="@{/expenses/save}" method="post" th:object="${expense}">
  <input type="hidden" th:field="*{id}"/>
  <label>Date: <input type="date" th:field="*{date}"/></label><br/>
  <label>Category: <input type="text" th:field="*{category}"/></label><br/>
  <label>Description: <input type="text" th:field="*{description}"/></label><br/>
  <label>Amount: <input type="number" step="0.01" th:field="*{amount}"/></label><br/>
  <button type="submit">Save</button>
</form>
<p><a th:href="@{/expenses}">Back</a></p>
</body>
</html>
